plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.openducktor.scroll'
version = '1.0.0'

android {
  namespace "com.openducktor.scroll"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // The module reads the Fabric UIManager to wait for the mount of a scroll view.
  // The React Native Gradle plugin resolves the react-android version.
  implementation 'com.facebook.react:react-android'
}
