appId: com.openducktor.app
productName: OpenDucktor
asar: true
npmRebuild: false
asarUnpack:
  - node_modules/keytar/**/*
  - node_modules/node-pty/**/*
  - node_modules/node-mac-permissions/**/*
  - node_modules/@ff-labs/fff-node/**/*
  - node_modules/@ff-labs/fff-bin-*/**/*
  - node_modules/ffi-rs/**/*
  - node_modules/@yuuang/**/*

publish:
  provider: github
  owner: Maxsky5
  repo: openducktor

directories:
  output: release

beforePack: scripts/dmg-hidden-files.cjs
afterAllArtifactBuild: scripts/print-package-artifacts.cjs

files:
  - dist/**/*
  - node_modules/keytar/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/node-mac-permissions/**/*
  - node_modules/node-pty/**/*
  - node_modules/@ff-labs/fff-node/**/*
  - node_modules/@ff-labs/fff-bin-*/**/*
  - node_modules/ffi-rs/**/*
  - node_modules/@yuuang/**/*
  - "!node_modules/node-pty/scripts/**/*"
  # MSAL persistence uses the runtime's JavaScript exports, not its native broker.
  - "!node_modules/@azure/msal-node-runtime/dist/linux/**/*"
  - "!node_modules/@azure/msal-node-runtime/dist/macos/**/*"
  - "!node_modules/@azure/msal-node-runtime/dist/windows/**/*"

extraResources:
  - from: build/sidecars
    to: bin
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.icns
    to: icon.icns
  - from: resources/icon.png
    to: icon.png

extraMetadata:
  main: dist/main.js
  dependencies:
    "@azure/msal-node-extensions": 5.5.1
    node-pty: 1.2.0-beta.14

mac:
  artifactName: OpenDucktor-${version}-${os}-${arch}.${ext}
  icon: resources/icon.icns
  minimumSystemVersion: "12.0"
  binaries:
    - Contents/Resources/bin/openducktor-mcp
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  target:
    - dmg
    - zip

dmg:
  background: resources/dmg-background.png
  icon: resources/icon.icns
  iconSize: 104
  iconTextSize: 13
  contents:
    - x: 170
      y: 170
      type: file
    - x: 528
      y: 170
      type: link
      path: /Applications

win:
  artifactName: OpenDucktor-${version}-${os}-${arch}.${ext}
  icon: resources/icon.ico
  target:
    - nsis
    - zip

linux:
  category: Development
  executableName: openducktor
  artifactName: OpenDucktor-${version}-${os}-${arch}.${ext}
  icon: resources/icon.png
  target:
    - AppImage
    - deb

deb:
  packageName: openducktor
