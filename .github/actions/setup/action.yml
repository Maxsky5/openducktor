name: Setup
description: Install Node, Bun, and the workspace dependencies.

# A cold install from the registry is faster than a restore of the Bun cache on every runner, and
# the cache used most of the cache storage of the repository.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Without an input, the action installs the Bun version of `packageManager` in package.json.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    # Bun links packages from its cache, so the cache must be on the volume of the checkout.
    - if: runner.os == 'Windows'
      shell: bash
      run: echo "BUN_INSTALL_CACHE_DIR=D:/bun-cache" >> "$GITHUB_ENV"

    - shell: bash
      run: bun install --frozen-lockfile

    # The temp trees of the later steps, such as the Git repositories of the host tests, are about
    # a third faster on the D: drive than on the C: drive.
    - if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p D:/tmp
        echo 'TMP=D:\tmp' >> "$GITHUB_ENV"
        echo 'TEMP=D:\tmp' >> "$GITHUB_ENV"
