name: Setup
description: Install Node, Bun, and the workspace dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Without an input, the action installs the Bun version of `packageManager` in package.json.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    # Bun links packages from its cache, so the cache must be on the volume of the checkout.
    - if: runner.os == 'Windows'
      shell: bash
      run: |
        mkdir -p D:/bun-cache
        echo "BUN_INSTALL_CACHE_DIR=D:/bun-cache" >> "$GITHUB_ENV"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'Windows' && 'D:/bun-cache' || '~/.bun/install/cache' }}
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - shell: bash
      run: bun install --frozen-lockfile
