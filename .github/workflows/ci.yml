name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  BUN_VERSION: 1.4.3

jobs:
  react-doctor:
    name: React Doctor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run React Doctor
        uses: millionco/react-doctor@673ce802a375eeb4c3c5cb9a96d21eaeb7eafd93 # v2.3.1
        with:
          project: "@openducktor/frontend,@openducktor/frontend-core,@openducktor/electron"
          blocking: warning
          version: "0.9.14"

  typescript-workspace-quality:
    name: TypeScript Workspace Quality (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runner: ubuntu-latest
            bunCacheDir: ~/.bun/install/cache
          - label: macOS
            runner: macos-15
            bunCacheDir: ~/.bun/install/cache
          - label: Windows
            runner: windows-latest
            bunCacheDir: D:/bun-cache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Use a same-volume Bun install cache
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "BUN_INSTALL_CACHE_DIR=${{ matrix.bunCacheDir }}" >> "$GITHUB_ENV"
          mkdir -p "${{ matrix.bunCacheDir }}"

      - name: Cache Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.bunCacheDir }}
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint workspaces
        run: bun run lint

      - name: Typecheck workspaces
        run: bun run typecheck

      - name: Test workspaces
        run: bun run test

      - name: Build workspaces
        # The Marketing website workflow builds the site when its inputs change.
        run: bun run --filter '*' --filter '!@openducktor/marketing-website' build

      - name: Install Electron runtime for worker checks
        run: node apps/electron/node_modules/electron/install.js

      - name: Check built image workers in Node, Bun, and Electron
        run: bun run test:workers
