name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  react-doctor:
    name: React Doctor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run React Doctor
        uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        with:
          project: "@openducktor/frontend,@openducktor/frontend-core,@openducktor/electron,@openducktor/mobile"
          blocking: warning
          version: "0.9.14"

  typescript-workspace-quality:
    name: TypeScript Workspace Quality (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runner: ubuntu-latest
          - label: macOS
            runner: macos-15
          - label: Windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Check formatting
        run: bun run format:check

      - name: Lint workspaces
        run: bun run lint

      - name: Typecheck workspaces
        run: bun run typecheck

      - name: Test workspaces
        run: bun run test

      - name: Build workspaces
        # The Marketing website workflow builds the site when its inputs change.
        run: bun run --filter '*' --filter '!@openducktor/marketing-website' build

      # Dry run of the release deploy, which runs on Linux. It needs no Cloudflare credentials.
      - name: Check the web client headers and Cloudflare upload
        if: runner.os == 'Linux'
        run: bun run --filter @openducktor/web worker:check

      - name: Install Electron runtime for worker checks
        run: node apps/electron/node_modules/electron/install.js

      - name: Check built workers in Node, Bun, and Electron
        run: bun run test:workers

  mobile-changes:
    name: Mobile Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The inputs are the app, the workspace packages that it uses, and the install and CI files.
      # A manual run has no base commit, so it builds the app.
      - name: Compare the mobile inputs with the base commit
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" ]] || ! git diff --quiet "$BASE" HEAD -- apps/mobile packages/adapters-codex-app-server \
            packages/contracts packages/core packages/frontend-core packages/host-client packages/path-support \
            package.json bun.lock .github/actions .github/workflows/ci.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  mobile-ios:
    name: Mobile iOS Build
    needs: mobile-changes
    if: needs.mobile-changes.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # An unsigned simulator build compiles the Swift modules and the native dependencies.
      - name: Build the iOS app for the simulator
        working-directory: apps/mobile
        run: |
          bun run build:page
          bunx expo prebuild --platform ios --clean --no-install
          (cd ios && pod install)
          xcodebuild build -workspace ios/OpenDucktor.xcworkspace -scheme OpenDucktor -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

  mobile-android:
    name: Mobile Android Build
    needs: mobile-changes
    if: needs.mobile-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Without the upload key, the release build signs with the debug key. One ABI is enough to
      # compile the native code.
      - name: Build the Android release APK
        working-directory: apps/mobile
        run: |
          bun run build:page
          bunx expo prebuild --platform android --clean --no-install
          cd android
          JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
