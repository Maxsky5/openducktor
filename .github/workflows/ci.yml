name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  react-doctor:
    name: React Doctor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run React Doctor
        uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        with:
          project: "@openducktor/frontend,@openducktor/frontend-core,@openducktor/electron,@openducktor/mobile"
          blocking: warning
          version: "0.9.14"

  # The `TypeScript Workspace Quality` job of a platform is the required check of all its jobs.
  checks-linux:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: &checks-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Check formatting
        run: bun run format:check

      - name: Lint workspaces
        run: bun run lint

      - name: Typecheck workspaces
        run: bun run typecheck

      # `expo export` bundles the JavaScript of the mobile app. Metro transforms each module only
      # once: a build reads the transforms of the last build on main and writes the transforms that
      # it uses to a new directory, so the saved cache holds no stale entries.
      - name: Restore the Metro cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-${{ runner.os }}-${{ github.sha }}
          restore-keys: metro-${{ runner.os }}-

      - name: Build the mobile app
        shell: bash
        env:
          EXPO_METRO_CACHE_RESTORE_DIR: ${{ runner.temp }}/metro-cache-restored
          EXPO_METRO_CACHE_OUTPUT_DIR: ${{ runner.temp }}/metro-cache
        run: |
          mkdir -p "$EXPO_METRO_CACHE_OUTPUT_DIR"
          mv "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"
          mkdir "$EXPO_METRO_CACHE_OUTPUT_DIR"
          bun run --filter @openducktor/mobile build

      - name: Save the Metro cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-${{ runner.os }}-${{ github.sha }}

  checks-macos:
    name: Checks (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps: *checks-steps

  checks-windows:
    name: Checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps: *checks-steps

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps: &build-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # The Marketing website workflow builds the site when its inputs change. The Checks job
      # builds the mobile app.
      - name: Build workspaces
        run: bun run --filter '*' --filter '!@openducktor/marketing-website' --filter '!@openducktor/mobile' build

      # Dry run of the release deploy, which runs on Linux. It needs no Cloudflare credentials.
      - name: Check the web client headers and Cloudflare upload
        if: runner.os == 'Linux'
        run: bun run --filter @openducktor/web worker:check

      - name: Install Electron runtime for worker checks
        run: node apps/electron/node_modules/electron/install.js

      - name: Check built workers in Node, Bun, and Electron
        run: bun run test:workers

  build-macos:
    name: Build (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps: *build-steps

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps: *build-steps

  # Each shard runs every workspace suite in sequence on a part of its test files.
  tests-linux:
    name: Tests (Linux, ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps: &tests-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Test workspaces
        run: bun run scripts/test-shard.ts ${{ matrix.shard }}/${{ strategy.job-total }}

  tests-macos:
    name: Tests (macOS, ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps: *tests-steps

  tests-windows:
    name: Tests (Windows, ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps: *tests-steps

  quality-linux:
    name: TypeScript Workspace Quality (Linux)
    needs: [checks-linux, build-linux, tests-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: &quality-steps
      - name: Require every job of the platform to pass
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A job of this platform ended with the result '$result'. Fix that job."
              exit 1
            fi
          done

  quality-macos:
    name: TypeScript Workspace Quality (macOS)
    needs: [checks-macos, build-macos, tests-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *quality-steps

  quality-windows:
    name: TypeScript Workspace Quality (Windows)
    needs: [checks-windows, build-windows, tests-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *quality-steps

  mobile-changes:
    name: Mobile Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only native inputs can break a native build: the native modules, the config plugins, the app
      # config and assets, the dependencies, and the CI files. The Checks jobs check the JavaScript
      # bundle. A manual run has no base commit, so it builds the app.
      - name: Compare the native inputs with the base commit
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE" ]] || ! git diff --quiet "$BASE" HEAD -- apps/mobile/modules apps/mobile/plugins \
            apps/mobile/app.config.ts apps/mobile/assets apps/mobile/package.json package.json bun.lock patches \
            .github/actions .github/workflows/ci.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pull requests generate the native projects, which runs the config plugins. The native builds run
  # after a merge to main and on manual runs.
  mobile-native-projects:
    name: Mobile Native Projects
    needs: mobile-changes
    if: github.event_name == 'pull_request' && needs.mobile-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Generate the iOS and Android projects
        working-directory: apps/mobile
        run: bunx expo prebuild --clean --no-install

  mobile-ios:
    name: Mobile iOS Build
    needs: mobile-changes
    if: github.event_name != 'pull_request' && needs.mobile-changes.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # A Debug build for the simulator compiles the Swift modules and the native dependencies once,
      # for the runner architecture, and skips the JavaScript bundle. It needs no store credentials.
      - name: Build the iOS app for the simulator
        working-directory: apps/mobile
        run: |
          bunx expo prebuild --platform ios --clean --no-install
          (cd ios && pod install)
          xcodebuild build -quiet -workspace ios/OpenDucktor.xcworkspace -scheme OpenDucktor -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO

  mobile-android:
    name: Mobile Android Build
    needs: mobile-changes
    if: github.event_name != 'pull_request' && needs.mobile-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # The Gradle and compiler caches carry over between the builds on main.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('bun.lock') }}
          restore-keys: gradle-

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: android
          max-size: 2G

      # A Debug build compiles the Kotlin and C++ code for one ABI and skips the JavaScript bundle and
      # R8. CMake reads the compiler launchers from the environment. Gradle installs the NDK of React
      # Native on each run, so ccache checks the compiler by its content.
      - name: Build the Android app
        working-directory: apps/mobile
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: content
        run: |
          bunx expo prebuild --platform android --clean --no-install
          cd android
          JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew :app:assembleDebug --build-cache --no-daemon \
            -PreactNativeArchitectures=arm64-v8a
