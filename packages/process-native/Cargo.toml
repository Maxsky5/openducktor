[package]
name = "openducktor-process-native"
version = "0.0.0"
edition = "2024"
# Let chains need Rust 1.88. Clippy checks newer APIs against this version.
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Kernel",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2"
cc = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every unsafe block states why its contract holds, and holds one unsafe operation.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# A panic inside a Node-API callback stops the host process.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
# The crate has no public Rust API, so its items need no `#[must_use]` notes.
must_use_candidate = "allow"
